{% extends "base.html" %}
{% block title %}Editar {{ game.title }}{% endblock %}
{% block content %}
<section class="intro">
    <p class="eyebrow">CATÁLOGO / EDIÇÃO</p>
    <h1>Editar jogo</h1>
    <p>Altere as informações de <strong>{{ game.title }}</strong>.</p>
</section>
<article class="panel">
    <form method="POST" action="{{ url_for('edit', game_id=game.id) }}">
        <label>Título
            <input type="text" name="title" value="{{ game.title }}" maxlength="120" required>
        </label>
        <label>Gênero
            <input type="text" name="genre" value="{{ game.genre }}" maxlength="80" required>
        </label>
        <label>Plataformas de lançamento
            <input type="text" name="platforms" value="{{ game.platforms }}" maxlength="180" required>
        </label>
        <label>Ano de lançamento
            <input type="number" name="release_year" value="{{ game.release_year }}" min="1950" max="2100" required>
        </label>
        <label>Arquivo do pôster
            <input type="text" name="poster" value="{{ game.poster }}" required>
        </label>
        <div class="inline-actions">
            <button type="submit">Salvar alterações</button>
            <a href="{{ url_for('home') }}" role="button" class="secondary outline">Cancelar</a>
        </div>
    </form>
</article>
{% endblock %}
